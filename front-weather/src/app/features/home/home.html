<section
  class="mx-auto flex min-h-[calc(100vh-65px)] max-w-7xl items-center justify-center px-4 py-12"
>
  <div class="w-full max-w-2xl">

    <div class="mb-8 text-center">

      <z-badge zType="secondary" class="mb-4">
        Météo en temps réel
      </z-badge>

      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">
        Quelle météo fait-il ?
      </h1>

      <p class="mt-4 text-muted-foreground">
        Recherchez une ville pour consulter les conditions
        météorologiques actuelles.
      </p>

    </div>

    <z-card class="w-full">

      <div z-card-content class="p-6">

        <form
          class="flex flex-col gap-3 sm:flex-row"
          (ngSubmit)="searchWeather()"
        >

          <input
            z-input
            type="text"
            name="city"
            [(ngModel)]="city"
            placeholder="Paris, Lyon, Londres..."
            autocomplete="off"
            class="flex-1"
          />

          <button
            z-button
            type="submit"
            [zLoading]="loading"
            [zDisabled]="!city.trim()"
          >
            Rechercher
          </button>

        </form>

        <p class="mt-3 text-sm text-muted-foreground">
          Exemple : Paris, Bordeaux, Tokyo, New York...
        </p>

      </div>

    </z-card>

  </div>
</section>
